<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报销截图转Excel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #333; font-size: 24px; text-align: center; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; text-align: center; margin-bottom: 30px; }
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .upload-area:hover { border-color: #667eea; background: #f8f9ff; }
        .upload-icon { font-size: 48px; margin-bottom: 15px; }
        input[type="file"] { display: none; }
        .file-info {
            display: none;
            background: #f0f3ff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .file-info.show { display: block; }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .tips { margin-top: 20px; font-size: 13px; color: #666; }
        .result {
            display: none;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .result.show { display: block; }
        .result.success { border: 2px solid #27ae60; }
        .result.error { border: 2px solid #e74c3c; }
        .result h2 { font-size: 18px; margin-bottom: 15px; }
        .result.success h2 { color: #27ae60; }
        .result.error h2 { color: #e74c3c; }
        .download-btn {
            display: block;
            padding: 15px;
            background: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>报销截图转Excel</h1>
        <p class="subtitle">上传报销截图，自动识别生成Excel</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📷</div>
            <p>点击或拖拽图片到这里<br><strong>PNG/JPG</strong></p>
        </div>
        <input type="file" id="fileInput" accept="image/png,image/jpeg" multiple>

        <div class="file-info" id="fileInfo"></div>
        <button class="btn" id="submitBtn" disabled>开始处理</button>

        <div class="result" id="result">
            <h2 id="resultTitle"></h2>
            <div id="resultContent"></div>
            <a class="download-btn" id="downloadBtn" href="#" target="_blank">打开并下载 Excel</a>
        </div>

        <ul class="tips">
            <li>支持微信支付、支付宝等截图</li>
            <li>自动识别金额、日期、商户</li>
        </ul>
    </div>

    <script>
        var API_URL = 'https://baoxiao-mopfweseib.cn-hangzhou.fcapp.run';

        var uploadArea = document.getElementById('uploadArea');
        var fileInput = document.getElementById('fileInput');
        var fileInfo = document.getElementById('fileInfo');
        var submitBtn = document.getElementById('submitBtn');
        var result = document.getElementById('result');
        var resultTitle = document.getElementById('resultTitle');
        var resultContent = document.getElementById('resultContent');
        var downloadBtn = document.getElementById('downloadBtn');

        uploadArea.onclick = function() {
            fileInput.click();
        };

        fileInput.onchange = function(e) {
            var file = e.target.files[0];
            if (file) {
                fileInfo.textContent = '已选择: ' + file.name;
                fileInfo.classList.add('show');
                submitBtn.disabled = false;
            }
        };

        // 拖拽
        uploadArea.ondragover = function(e) {
            e.preventDefault();
            uploadArea.style.borderColor = '#667eea';
        };
        uploadArea.ondragleave = function() {
            uploadArea.style.borderColor = '#ddd';
        };
        uploadArea.ondrop = function(e) {
            e.preventDefault();
            uploadArea.style.borderColor = '#ddd';
            if (e.dataTransfer.files[0]) {
                fileInput.files = e.dataTransfer.files;
                var file = e.dataTransfer.files[0];
                fileInfo.textContent = '已选择: ' + file.name;
                fileInfo.classList.add('show');
                submitBtn.disabled = false;
            }
        };

// 提交
        submitBtn.onclick = async function() {
            var files = fileInput.files;
            if (files.length === 0) {
                alert('请先选择图片文件');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = `正在拼命处理 ${files.length} 张图片...`;
            result.classList.remove('show');

            try {
                // 1. 批量读取所有图片为 Base64
                const base64Images = [];
                for (let i = 0; i < files.length; i++) {
                    const base64 = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = () => reject(new Error('读取文件失败'));
                        reader.readAsDataURL(files[i]);
                    });
                    base64Images.push(base64);
                }

                // 2. 发送请求给阿里云 (把 image 字段改为 images 数组)
                var xhr = new XMLHttpRequest();
                xhr.open('POST', API_URL, true);
                xhr.setRequestHeader('Content-Type', 'application/json');

                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        submitBtn.textContent = '开始处理';
                        submitBtn.disabled = false;
                        result.classList.add('show');

                        try {
                            var data = JSON.parse(xhr.responseText);
                            if (data.error) {
                                result.classList.add('error');
                                resultTitle.textContent = '处理失败';
                                resultContent.textContent = data.error;
                                downloadBtn.style.display = 'none';
                            } else {
                                result.classList.add('success');
                                result.classList.remove('error');
                                resultTitle.textContent = '🎉 批量处理完成！';
                                resultContent.innerHTML = `<p>共成功识别并生成 <b>${data.count}</b> 条报销记录。</p>`;
                                downloadBtn.href = data.download_url;
                                downloadBtn.style.display = 'block';
                            }
                        } catch(err) {
                            result.classList.add('error');
                            resultTitle.textContent = '请求失败';
                            resultContent.textContent = '解析响应失败';
                            downloadBtn.style.display = 'none';
                        }
                    }
                };
                
                // 注意这里发送的是 images 数组
                xhr.send(JSON.stringify({images: base64Images}));

            } catch (error) {
                alert(error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = '开始处理';
            }
        };
    </script>
</body>
</html>
